<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="orb-core" cx="50%" cy="50%" r="50%" fx="40%" fy="35%" id="orb-core" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="orb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="55%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="300" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Orb glow halo (outer) -->
  <circle cx="960" cy="150" r="120" fill="url(#orb-glow)"/>
  <circle cx="960" cy="150" r="90" fill="url(#gold-glow)"/>

  <!-- Orb ring 3 (outermost) -->
  <circle cx="960" cy="150" r="80" fill="none" stroke="#4ade80" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="6 4"/>

  <!-- Orb ring 2 -->
  <circle cx="960" cy="150" r="60" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.30"/>

  <!-- Orb ring 1 -->
  <circle cx="960" cy="150" r="42" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.40"/>

  <!-- Orb core -->
  <circle cx="960" cy="150" r="28" fill="url(#orb-core)" filter="url(#glow-filter)"/>

  <!-- Orb inner highlight -->
  <circle cx="953" cy="142" r="9" fill="#86efac" fill-opacity="0.45"/>

  <!-- Gold particle dots on ring 2 -->
  <circle cx="960" cy="90" r="3" fill="#fbbf24" fill-opacity="0.80"/>
  <circle cx="1020" cy="150" r="2.5" fill="#fbbf24" fill-opacity="0.65"/>
  <circle cx="960" cy="210" r="2" fill="#4ade80" fill-opacity="0.55"/>
  <circle cx="900" cy="150" r="2.5" fill="#4ade80" fill-opacity="0.65"/>

  <!-- Text group -->
  <!-- App name -->
  <text x="80" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="68" font-weight="800" letter-spacing="-2"
        fill="url(#title-grad)">AI Hub</text>

  <!-- Tagline -->
  <text x="82" y="178" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Deine KI-Community-Plattform mit eingebautem KI-Begleiter
  </text>

  <!-- Divider line under tagline -->
  <line x1="82" y1="200" x2="460" y2="200" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Sub-caption -->
  <text x="82" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400" fill="#64748b" letter-spacing="0.5">
    Next.js 14 · Supabase · Multi-Provider AI · 643 Tests
  </text>

  <!-- Bottom border accent -->
  <rect x="0" y="294" width="1200" height="6" rx="0" fill="url(#title-grad)" fill-opacity="0.6"/>
</svg>
