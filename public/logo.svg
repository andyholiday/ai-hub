<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bg-grad)"/>
  <!-- Neural network nodes -->
  <circle cx="16" cy="14" r="2.5" fill="url(#accent-grad)" opacity="0.7"/>
  <circle cx="32" cy="14" r="2.5" fill="url(#accent-grad)" opacity="0.7"/>
  <circle cx="12" cy="26" r="2.5" fill="url(#accent-grad)" opacity="0.7"/>
  <circle cx="36" cy="26" r="2.5" fill="url(#accent-grad)" opacity="0.7"/>
  <circle cx="24" cy="20" r="3" fill="#c7d2fe"/>
  <!-- Neural connections -->
  <line x1="16" y1="14" x2="24" y2="20" stroke="#818cf8" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="14" x2="24" y2="20" stroke="#818cf8" stroke-width="0.8" opacity="0.5"/>
  <line x1="12" y1="26" x2="24" y2="20" stroke="#818cf8" stroke-width="0.8" opacity="0.5"/>
  <line x1="36" y1="26" x2="24" y2="20" stroke="#818cf8" stroke-width="0.8" opacity="0.5"/>
  <!-- "AI" text -->
  <text x="24" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1.5">AI</text>
</svg>
