<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg)"/>
  <!-- Simplified neural dot -->
  <circle cx="16" cy="12" r="2.5" fill="#c7d2fe"/>
  <!-- "AI" text -->
  <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">AI</text>
</svg>
